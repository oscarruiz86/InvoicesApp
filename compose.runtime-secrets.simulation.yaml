name: ${SIMULATION_PROJECT:?Project name must be unique}
services:
  mongodb:
    image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    command: ["mongod", "--replSet", "runtime-rs", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${SIMULATION_MONGO_PORT:-27037}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { if (e.code === 94) rs.initiate({_id:'runtime-rs',members:[{_id:0,host:'mongodb:27017'}]}); else throw e; } quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [isolated]
  notification-worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      MONGODB_URI_FILE: /run/secrets/mongodb-uri
      INVITATION_PUBLIC_ORIGIN: https://simulation.example.invalid
      SMTP_ENABLED: "false"
      NOTIFICATION_PAYLOAD_KEY_FILE: /run/secrets/payload-key
    volumes:
      - type: bind
        source: ${SIMULATION_SECRET_DIR:?Secret directory required}/mongodb-uri
        target: /run/secrets/mongodb-uri
        read_only: true
      - type: bind
        source: ${SIMULATION_SECRET_DIR:?Secret directory required}/payload-key
        target: /run/secrets/payload-key
        read_only: true
    ports:
      - "127.0.0.1:${SIMULATION_PORT:-18090}:8090"
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [isolated]
networks:
  isolated:
    internal: true
