<!doctype html>
<html lang="es">
<head>

    @media(max-width:640px){.appbar{height:60px;padding:0 14px}.account .account-name,.context-label{display:none}.preview-toggle{display:none}.layout{min-height:0}.sidebar{inset:60px auto 0 0;max-height:calc(100vh - 60px);max-height:calc(100dvh - 60px)}.main{padding:20px 16px 28px}.page-header{display:block;padding-bottom:16px;margin-bottom:18px}.header-actions{margin-top:14px}.header-actions .btn{flex:1}.toolbar{align-items:stretch;flex-direction:row}.toolbar-start,.toolbar-end{width:auto}.toolbar-start .btn{flex:1}.toolbar-end .btn{flex:1}.pages{flex-wrap:wrap}.cards,.panel-grid{grid-template-columns:1fr}.pagination{align-items:stretch;flex-direction:column}.pagination .right{display:flex;justify-content:space-between;align-items:center}.dialog-body{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.desktop-table{display:none}.mobile-only{display:block}.mobile-only .small-action{width:auto;min-width:92px;padding:0 12px;font-size:12px}.mobile-only .small-action svg{display:none}.mobile-only .small-action[data-consult]::after{content:'Consultar'}.mobile-only .small-action[data-edit]::after{content:'Editar'}.page-header h1{font-size:25px}}
    @media(min-width:641px) and (max-width:850px){.desktop-table{display:block}.mobile-only{display:none}}
    body.mobile-preview{background:#e2e8f0}body.mobile-preview .app-shell{width:min(390px,100%);min-height:100vh;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px var(--line),0 12px 40px #17233a30}body.mobile-preview .appbar{height:60px;padding:0 12px;gap:9px}body.mobile-preview .layout{min-height:calc(100vh - 105px)}body.mobile-preview .sidebar{position:fixed;z-index:9;inset:60px auto 0 max(calc((100vw - 390px)/2),0px);width:275px;max-height:calc(100vh - 60px);max-height:calc(100dvh - 60px);height:auto;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow)}body.mobile-preview .sidebar.open{transform:translateX(0)}body.mobile-preview .main{padding:20px 16px 28px}body.mobile-preview .page-header{display:block;padding-bottom:16px;margin-bottom:18px}body.mobile-preview .page-header h1{font-size:25px}body.mobile-preview .toolbar{align-items:stretch;flex-direction:row}body.mobile-preview .toolbar-start,body.mobile-preview .toolbar-end{width:auto}body.mobile-preview .desktop-table{display:none}body.mobile-preview .mobile-only{display:block}body.mobile-preview .pagination{align-items:stretch;flex-direction:column}body.mobile-preview .pagination .right{display:flex;justify-content:space-between;align-items:center}body.mobile-preview .account .account-name,body.mobile-preview .context-label{display:none}body.mobile-preview .preview-toggle{font-size:0;width:36px;min-width:36px;padding:0}body.mobile-preview .preview-toggle::before{content:"▯";font-size:18px}body.mobile-preview .dialog{width:min(362px,calc(100vw - 24px))}
    body.visitor-preview .appbar,body.visitor-preview .sidebar{display:none}body.visitor-preview .layout{display:block;min-height:calc(100vh - 48px)}body.visitor-preview .main{width:100%;max-width:1100px;margin:0 auto}
    .mobile-order{display:none}@media(max-width:640px){.mobile-order{display:grid}}body.mobile-preview .mobile-order{display:grid}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.company-select{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:48px}.company-options{display:grid;gap:8px}.company-option{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:60px}.company-option small{color:var(--muted)}
    .table-loading{width:100%;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper)}.table-loading-head,.table-loading-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:18px;align-items:center;padding:14px 16px}.table-loading-head{background:var(--soft);border-bottom:1px solid var(--line)}.table-loading-head span{min-width:0;overflow-wrap:anywhere}.loading-column-label{font-size:12px;font-weight:700;color:#17233a}.table-loading-row{min-height:54px;border-bottom:1px solid var(--line)}.table-loading-row:last-child{border-bottom:0}.skeleton{height:14px;border-radius:999px;background:linear-gradient(90deg,#e2e8f0 20%,#f1f5f9 42%,#e2e8f0 64%);background-size:240% 100%;animation:shimmer 1.25s ease-in-out infinite}.skeleton.short{width:55%}.skeleton.medium{width:76%}.skeleton.long{width:92%}.loading-caption{display:flex;align-items:center;gap:10px;padding:14px 16px;color:var(--muted);font-size:13px}.loading-caption .spinner{width:16px;height:16px;border-width:2px}.empty-table{padding:20px 16px;text-align:center;color:var(--muted)}.empty-alert{margin:0 0 12px;padding:14px 16px;border:1px solid #bae6fd;border-radius:10px;background:#e0f2fe;color:#075985}.context-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff}.context-card strong{font-size:15px}.context-card small{grid-column:1;color:var(--muted)}.context-card button{grid-column:2;grid-row:1 / span 2}.detail-status{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:12px}
    @keyframes shimmer{to{background-position:-240% 0}}
    @media(max-width:640px){.table-loading-head,.table-loading-row{gap:8px;padding:12px 10px}.context-card{grid-template-columns:1fr}.context-card button{grid-column:1;grid-row:auto;width:100%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}.spinner{animation:none}}
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="appbar">

    </header>
    <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="nav-label">General</div>
      <button class="nav-item" data-view="home"><span class="nav-icon">⌂</span>Inicio</button>
      <div class="nav-label">Operación</div>
      <button class="nav-item active" data-view="companies"><span class="nav-icon">▤</span>Empresas</button>
      <button class="nav-item" data-view="thirdparties"><span class="nav-icon">♧</span>Terceros</button>
      <button class="nav-item" data-view="vehicles"><span class="nav-icon">▱</span>Vehículos</button>
      <button class="nav-item" data-view="assignments"><span class="nav-icon">⇄</span>Asignaciones</button>
      <button class="nav-item" data-view="invoices"><span class="nav-icon">▧</span>Facturas</button>
      <div class="nav-label">Administración</div>
      <button class="nav-item" data-view="users"><span class="nav-icon">♙</span>Usuarios</button>
      <button class="nav-item" data-view="invitations"><span class="nav-icon">✉</span>Invitaciones</button>
      <button class="nav-item" data-view="roles"><span class="nav-icon">⚿</span>Roles y permisos</button>
      <button class="nav-item" data-view="parameters"><span class="nav-icon">⚙</span>Parámetros</button>
    </aside>
    <main class="main" id="main"></main>
    </div>
    <footer>Invoices App · Wireframe de referencia</footer>
  </div>
  <div class="backdrop" id="modal" role="presentation">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-head"><div><div class="eyebrow" id="dialogEyebrow">Registro</div><h2 id="dialogTitle">Crear registro</h2></div><button class="icon-btn" data-close aria-label="Cerrar">×</button></div>
      <div class="dialog-body" id="dialogBody"></div>
      <div class="dialog-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="saveBtn">Guardar</button></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const records = {

      thirdparties:[['Distribuciones El Sol','Transportes Andinos S.A.S.','NIT · 830072190','contacto@distribuciones.co','Activa','Colombia','Cundinamarca','Bogotá'],['Comercializadora del Valle','Empresa Demo','NIT · 900440712','ventas@valle.co','Activa','Colombia','Valle','Cali'],['Suministros La 14','Transportes Andinos S.A.S.','NIT · 901112008','compras@la14.co','Pendiente','Colombia','Antioquia','Medellín'],['Abastecimientos Rápidos','Logística del Norte Ltda.','NIT · 800129443','info@rapidos.co','Activa','Colombia','Atlántico','Barranquilla'],['Importadora Central','Empresa Demo','NIT · 900881207','contacto@central.co','Activa','Colombia','Cundinamarca','Bogotá']],

      invoices:[['FV-2026-01842','Transportes Andinos','KLM-482','Carlos Ramírez','Manual','Registrada','20 nov 2026'],['FV-2026-01841','Logística del Norte','TQR-916','Laura Gómez','Lectura QR','Registrada','20 nov 2026'],['FV-2026-01840','Carga Express','FDS-204','Jorge Rojas','Lectura QR','En revisión','19 nov 2026'],['FV-2026-01839','Ruta Segura','MNP-771','Diana Mora','Manual','Registrada','18 nov 2026']],

      invitations:[['elsuperdrive@yopmail.com','Transportes Andinos S.A.S.','tercero uno','Conductor','Aceptada','Completada','19 nov 2026','22 nov 2026'],['yo_conductor@yopmail.com','Empresa Demo','tercero uno','Conductor','Aceptada','Completada','19 nov 2026','22 nov 2026'],['listo@yopmail.com','Logística del Norte Ltda.','desc_cambio','Administrador de tercero','Aceptada','Completada','18 nov 2026','21 nov 2026'],['perrito11@yopmail.com','Transportes Andinos S.A.S.','tercero uno','Administrador de tercero','Vencida','Completada','18 nov 2026','21 nov 2026'],['kika@yopmail.com','Empresa Demo','desc_cambio','Administrador de empresa','Cancelada','Completada','18 nov 2026','21 nov 2026']],
      roles:[['Administrador de empresa','Gestionar empresa y usuarios','8 permisos','Activo'],['Operador logístico','Asignaciones y vehículos','5 permisos','Activo'],['Conductor','Consultar asignaciones propias','2 permisos','Activo'],['Auditor','Consultar registros','4 permisos','Activo']],
      parameters:[['Ventana de edición de facturas','invoice.edit.window','72 horas','Global'],['Tamaño de página predeterminado','list.page.size','20 registros','Global'],['Tiempo de invitación','invitation.expiration','7 días','Global']]
    };
    const config = {
      home:{title:'Inicio',subtitle:'Accesos disponibles para tu rol y el contexto actual.',singular:'módulo',cols:['Módulo','Resumen','Acceso']},
      companies:{title:'Empresas',subtitle:'Consulta y administra las empresas disponibles en tu contexto.',singular:'empresa',cols:['Empresa','Identificación','Estado','Creada'],optional:[3]},
      thirdparties:{title:'Terceros',subtitle:'Directorio de terceros vinculados a la operación.',singular:'tercero',cols:['Razón social','Empresa','NIT','Correo','Estado','País','Departamento','Ciudad'],optional:[5,6,7]},
      vehicles:{title:'Vehículos',subtitle:'Administra la flota y consulta su estado operativo.',singular:'vehículo',cols:['Placa','Referencia','Estado','Tipo'],optional:[3]},
      assignments:{title:'Asignaciones',subtitle:'Gestiona las relaciones vigentes entre conductores y vehículos.',singular:'asignación',cols:['Conductor','Documento','Estado','Vehículo'],optional:[1]},
      invoices:{title:'Facturas',subtitle:'Consulta las facturas registradas en la organización.',singular:'factura',cols:['Factura','Emisor','Placa','Conductor','Origen','Estado','Fecha'],optional:[1,3,6]},
      users:{title:'Usuarios',subtitle:'Administra pertenencias, roles y acceso a organizaciones.',singular:'usuario',cols:['Usuario','Correo','Rol','Estado'],optional:[1]},
      invitations:{title:'Invitaciones',subtitle:'Consulta y administra las invitaciones de acceso.',singular:'invitación',cols:['Correo','Empresa','Organización','Rol','Estado','Entrega','Creada','Vence'],optional:[2,5,6,7]},
      roles:{title:'Roles y permisos',subtitle:'Define qué acciones puede realizar cada rol.',singular:'rol',cols:['Rol','Descripción','Permisos','Estado'],optional:[1,2]},
      parameters:{title:'Parámetros funcionales',subtitle:'Consulta los valores que gobiernan los flujos de negocio.',singular:'parámetro',cols:['Parámetro','Clave','Valor','Ámbito'],optional:[1,3]}
    };
    const statusIndex={companies:2,thirdparties:4,vehicles:2,assignments:2,invoices:5,users:3,invitations:4,roles:3};
    let view='companies', page=1, pageSize=5, query='', statusFilter='Todos', sortColumn=0, sortDirection=1, companyPickerPurpose='filters', pendingCreateCompany='';
    const main=document.querySelector('#main'), modal=document.querySelector('#modal'), sidebar=document.querySelector('#sidebar');
    document.querySelector('#menuToggle').setAttribute('aria-expanded',String(innerWidth>850));
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
    function statusBadge(label){const text=String(label),type=/inactiv|rechazad|cancelad/i.test(text)?'inactive':/pendiente|revisión|invitad/i.test(text)?'pending':/finalizad|vencid/i.test(text)?'neutral':/activo|activa|registrad|aceptad/i.test(text)?'active':'role';return `<span class="badge ${type}">${escapeHtml(text)}</span>`}
    let loadingTimer;
    function loadView(showNotice=false){clearTimeout(loadingTimer);const c=config[view],labels=[...(c?.cols||['Información']),'Acciones'],columnClasses=labels.map((_,i)=>c?.optional?.includes(i)?'col-optional':''),columns=labels.map((_label,i)=>`<span class="${columnClasses[i]} skeleton ${i%3===0?'long':i%2?'medium':'short'}"></span>`).join(''),headers=labels.map((label,i)=>`<span class="loading-column-label ${columnClasses[i]}">${escapeHtml(label)}</span>`).join('');main.innerHTML=`<div class="page-header"><div><div class="eyebrow">Operación · ${view==='roles'||view==='parameters'?'Administración':'Módulo'}</div><h1>${escapeHtml(c?.title||'Inicio')}</h1><p class="subtitle">${escapeHtml(c?.subtitle||'Accesos disponibles para tu rol y el contexto actual.')}</p></div></div><section role="status" aria-live="polite"><div class="loading-caption"><span class="spinner" aria-hidden="true"></span><span>Cargando ${escapeHtml(c?.title||'contenido').toLowerCase()}…</span></div><div class="table-loading desktop-table"><div class="table-loading-head">${headers}</div>${Array.from({length:5},()=>`<div class="table-loading-row">${columns}</div>`).join('')}</div><div class="cards mobile-only">${Array.from({length:3},()=>`<article class="card record-card"><div class="skeleton long"></div><div class="skeleton medium"></div><div class="skeleton short"></div></article>`).join('')}</div></section>`;loadingTimer=setTimeout(()=>{render();if(showNotice)toast('Lista actualizada')},650)}
    function setView(next){view=next;page=1;query='';statusFilter='Todos';companyFilter='';sortColumn=0;sortDirection=1;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===next));loadView();if(innerWidth<=850||document.body.classList.contains('mobile-preview'))sidebar.classList.remove('open')}
    let companyFilter='';
    function filteredRows(){const rows=(records[view]||[]).filter(r=>r.join(' ').toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es'))&&(statusFilter==='Todos'||statusIndex[view]===undefined||r[statusIndex[view]]===statusFilter));return rows.sort((a,b)=>String(a[sortColumn]??'').localeCompare(String(b[sortColumn]??''),'es',{numeric:true,sensitivity:'base'})*sortDirection)}
    function renderFilterSummary(){const chips=[];if(query.trim())chips.push(['query',`Búsqueda: ${query.trim()}`]);if(statusFilter!=='Todos')chips.push(['status',`Estado: ${statusFilter}`]);if(companyFilter)chips.push(['company',`Empresa: ${companyFilter}`]);return `<div class="filter-summary" aria-label="Filtros aplicados"><strong>Filtros aplicados:</strong>${chips.length?chips.map(([key,label])=>`<span class="filter-chip">${escapeHtml(label)} <button type="button" data-remove-filter="${key}" aria-label="Quitar filtro ${escapeHtml(label)}">×</button></span>`).join(''):'<span class="filter-empty">Ninguno</span>'}</div>`}
    function render(){const c=config[view];main.classList.toggle('wide-view',['roles','parameters'].includes(view));if(view==='home'){renderHome();return}const rows=filteredRows(),start=(page-1)*pageSize,shown=rows.slice(start,start+pageSize),pages=Math.max(1,Math.ceil(rows.length/pageSize));

      <div class="toolbar"><div class="toolbar-start"><button class="btn primary icon-only" id="createBtn" aria-label="${view==='invoices'?'Registrar factura':'Crear '+c.singular}" title="${view==='invoices'?'Registrar factura':'Crear '+c.singular}">＋</button></div><div class="toolbar-end"><button class="btn icon-only" id="filterBtn" aria-label="Filtrar registros" title="Filtrar registros"><span class="filter-icon" aria-hidden="true"></span></button><button class="btn icon-only mobile-order" id="sortBtn" aria-label="Ordenar registros" title="Ordenar registros">↕</button></div></div>
      ${shown.length?`<div class="surface desktop-table"><table class="table"><thead><tr>${c.cols.map((col,i)=>`<th class="${c.optional?.includes(i)?'col-optional':''}"><button class="sort" data-sort="${i}">${col} ${sortColumn===i?(sortDirection===1?'↑':'↓'):'↕'}</button></th>`).join('')}<th><span>Acciones</span></th></tr></thead><tbody>${shown.map((r,i)=>`<tr><td><span class="cell-main">${escapeHtml(r[0])}</span><span class="cell-sub">Registro ${String(start+i+1).padStart(3,'0')}</span></td>${r.slice(1).map((v,j)=>`<td class="${c.optional?.includes(j+1)?'col-optional':''}">${j+1===statusIndex[view]?statusBadge(v):view==='users'&&j===1?`<span class="badge role">${escapeHtml(v)}</span>`:escapeHtml(v)}</td>`).join('')}<td><div class="actions"><button class="small-action" data-consult="${start+i}" aria-label="Consultar registro" title="Consultar"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg></button><button class="small-action" data-edit="${start+i}" aria-label="Editar registro" title="Editar">✎</button></div></td></tr>`).join('')}</tbody></table></div>
      <div class="cards mobile-only">${shown.map((r,i)=>`<article class="card record-card"><h3>${escapeHtml(r[0])}</h3><p>${escapeHtml(r[1]||'')}</p>${view==='users'?`<p>${escapeHtml(r[2]||'')}</p>`:''}<div class="card-foot">${statusBadge(r[statusIndex[view]]??r[2]??'Disponible')}<div class="actions"><button class="small-action" data-consult="${start+i}" aria-label="Consultar registro" title="Consultar"><svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg></button><button class="small-action" data-edit="${start+i}" aria-label="Editar registro">✎</button></div></div></article>`).join('')}</div>
      <div class="pagination"><div class="pages"><button class="page-btn" data-page="first" aria-label="Primera página" title="Primera página">«</button><button class="page-btn" data-page="prev" aria-label="Página anterior">‹</button>${Array.from({length:pages},(_,i)=>`<button class="page-btn ${page===i+1?'active':''}" data-page="${i+1}">${i+1}</button>`).join('')}<button class="page-btn" data-page="next" aria-label="Página siguiente">›</button><button class="page-btn" data-page="last" aria-label="Última página" title="Última página">»</button><button class="btn refresh-icon" id="refreshBtn" aria-label="Actualizar listado" title="Actualizar listado">↻</button></div><div class="right"><span>Registros ${rows.length?start+1:0}–${Math.min(start+pageSize,rows.length)} de ${rows.length}</span> <select class="select" id="pageSize" aria-label="Registros por página"><option ${pageSize===5?'selected':''}>5</option><option ${pageSize===10?'selected':''}>10</option></select></div></div>`:
      `<div class="empty-alert" role="status"><strong>${view==='invoices'?'No hay facturas que coincidan con la consulta.':'No hay empresas que coincidan con la consulta.'}</strong><div>Ajusta la búsqueda o limpia los filtros.</div><button class="btn" id="clearBtn">Limpiar filtros</button></div><div class="surface desktop-table"><table class="table"><thead><tr>${c.cols.map((col,i)=>`<th class="${c.optional?.includes(i)?'col-optional':''}"><button class="sort" data-sort="${i}">${col} ${sortColumn===i?(sortDirection===1?'↑':'↓'):'↕'}</button></th>`).join('')}<th>Acciones</th></tr></thead><tbody></tbody></table></div><div class="cards mobile-only"><section class="surface empty empty-alert" role="status"><strong>${view==='invoices'?'No hay facturas que coincidan con la consulta.':'No hay empresas que coincidan con la consulta.'}</strong><p>Ajusta la búsqueda o limpia los filtros.</p><button class="btn" id="clearBtnMobile">Limpiar filtros</button></section></div><div class="pagination"><div class="pages"><button class="page-btn" disabled aria-label="Primera página">«</button><button class="page-btn" disabled aria-label="Página anterior">‹</button><button class="page-btn active" disabled>1</button><button class="page-btn" disabled aria-label="Página siguiente">›</button><button class="page-btn" disabled aria-label="Última página">»</button><button class="btn refresh-icon" id="refreshBtn" aria-label="Actualizar listado" title="Actualizar listado">↻</button></div><div class="right"><span>Registros 0–0 de 0</span> <select class="select" id="pageSize" aria-label="Registros por página"><option ${pageSize===5?'selected':''}>5</option><option ${pageSize===10?'selected':''}>10</option></select></div></div>`}`;
      document.querySelector('#pageSize')?.addEventListener('change',e=>{pageSize=Number(e.target.value);page=1;render()});
      document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{const max=Math.max(1,Math.ceil(filteredRows().length/pageSize));page=b.dataset.page==='first'?1:b.dataset.page==='last'?max:b.dataset.page==='prev'?Math.max(1,page-1):b.dataset.page==='next'?Math.min(max,page+1):Number(b.dataset.page);render()}));
      document.querySelectorAll('[data-consult]').forEach(b=>b.addEventListener('click',()=>openDialog('detail',shown[Number(b.dataset.consult)-start])));
      document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openDialog('edit',shown[Number(b.dataset.edit)-start])));
      document.querySelector('#createBtn')?.addEventListener('click',()=>openDialog('create'));
      document.querySelector('#sortBtn')?.addEventListener('click',()=>openDialog('sort'));
      document.querySelector('#refreshBtn')?.addEventListener('click',()=>loadView(true));
      document.querySelector('#filterBtn')?.addEventListener('click',()=>openDialog('filters'));
      document.querySelector('#clearBtn')?.addEventListener('click',()=>{query='';statusFilter='Todos';render()});
      document.querySelector('#clearBtnMobile')?.addEventListener('click',()=>{query='';statusFilter='Todos';render()});
      document.querySelectorAll('[data-remove-filter]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.removeFilter==='query')query='';if(b.dataset.removeFilter==='status')statusFilter='Todos';if(b.dataset.removeFilter==='company')companyFilter='';page=1;render()}));
      document.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{const column=Number(b.dataset.sort);sortDirection=sortColumn===column?-sortDirection:1;sortColumn=column;render()}));
    }
    function renderKeepFocus(id){const input=document.getElementById(id),pos=input?.selectionStart;render();const next=document.getElementById(id);next?.focus();next?.setSelectionRange(pos,pos)}
    let previewSession='authenticated';
    function renderLanding(){
      main.classList.remove('wide-view');document.body.classList.add('visitor-preview');
      main.innerHTML=`<section class="card panel" style="max-width:760px;margin:8vh auto;padding:clamp(24px,6vw,56px)"><div class="eyebrow">Gestión de operación y facturación</div><h1>Invoices App</h1><p class="subtitle">Administra empresas, terceros, vehículos, asignaciones e invitaciones desde un solo lugar.</p><div class="header-actions"><button class="btn primary" id="loginAction">Iniciar sesión</button><button class="btn" id="sessionPreview">Vista previa del Inicio</button></div></section>`;
      document.querySelector('#loginAction')?.addEventListener('click',()=>toast('Redirigiendo a Keycloak…'));
      document.querySelector('#sessionPreview')?.addEventListener('click',()=>{previewSession='authenticated';document.body.classList.remove('visitor-preview');setView('home')});
    }
    function renderHome(){
      main.classList.remove('wide-view');document.body.classList.remove('visitor-preview');
      const sessionActions=previewSession==='initializing'
        ? `<span role="status" class="loading-caption"><span class="spinner" aria-hidden="true"></span>Verificando sesión…</span>`
        : `<span class="badge active">Sesión activa</span><button class="btn" id="sessionReload">Simular recarga</button><button class="btn" id="visitorPreview">Ver landing</button>`;
      main.innerHTML=`<div class="page-header"><div><div class="eyebrow">Resumen</div><h1>Inicio</h1><p class="subtitle">Accesos disponibles para tu rol y el contexto actual.</p></div><div class="header-actions">${sessionActions}<button class="btn" id="checkApi">↻ Comprobar conexión</button></div></div>
        ${previewSession==='initializing'?`<div class="empty-alert" role="status">Estamos verificando tu sesión. Si sigue activa, conservarás tus accesos.</div>`:''}
        <div class="panel-grid"><article class="card panel"><h2>Empresas</h2><p>Consulta y administra las empresas disponibles en tu contexto.</p><button class="btn" data-home="companies">Abrir empresas →</button></article><article class="card panel"><h2>Facturas</h2><p>Revisa registros, estados y fechas de las facturas de la organización.</p><button class="btn" data-home="invoices">Abrir facturas →</button></article><article class="card panel"><div class="panel-top"><h2>Conexión con la API</h2><span class="status-chip" id="apiStatus">Disponible</span></div><p>Estado del servicio que utiliza la aplicación.</p><button class="btn" id="checkApi2">Comprobar conexión</button></article></div>`;
      document.querySelector('#visitorPreview')?.addEventListener('click',renderLanding);
      document.querySelector('#sessionReload')?.addEventListener('click',()=>{previewSession='initializing';renderHome();setTimeout(()=>{previewSession='authenticated';renderHome()},900)});
      document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.home)));
      document.querySelectorAll('#checkApi,#checkApi2').forEach(b=>b.addEventListener('click',()=>{document.querySelector('#apiStatus').textContent='Disponible';toast('API disponible')}));
    }
    let pendingCompanyFilter='';
    function openDialog(kind,row){const title=document.querySelector('#dialogTitle'),body=document.querySelector('#dialogBody'),save=document.querySelector('#saveBtn'),eyebrow=document.querySelector('#dialogEyebrow');save.style.display='inline-block';save.disabled=false;modal.classList.add('open');document.body.style.overflow='hidden';
      if(kind==='sort'){eyebrow.textContent='Orden de registros';title.textContent='Ordenar '+config[view].title.toLowerCase();body.innerHTML=`<label class="form-field full">Columna<select id="sortColumn">${config[view].cols.map((column,index)=>`<option value="${index}" ${sortColumn===index?'selected':''}>${escapeHtml(column)}</option>`).join('')}</select></label><label class="form-field full">Dirección<select id="sortDirection"><option value="1" ${sortDirection===1?'selected':''}>Ascendente</option><option value="-1" ${sortDirection===-1?'selected':''}>Descendente</option></select></label>`;save.textContent='Aplicar orden';save.onclick=()=>{sortColumn=Number(document.querySelector('#sortColumn').value);sortDirection=Number(document.querySelector('#sortDirection').value);page=1;closeDialog();render()};return}
      if(kind==='login'){eyebrow.textContent='Acceso seguro';title.textContent='Iniciar sesión';body.innerHTML=`<p class="full">Serás redirigido a Keycloak para autenticarte con tu cuenta institucional.</p>`;save.textContent='Ir a Keycloak';save.onclick=()=>{closeDialog();toast('Redirigiendo a Keycloak…')};return}
      if(kind==='companyPicker'){eyebrow.textContent='Selector compartido';title.textContent='Seleccionar empresa';save.style.display='none';body.innerHTML=`<label class="form-field full">Buscar por nombre o NIT<input id="companySearch" placeholder="Buscar empresa…"></label><div class="company-options full">${['Todas las empresas','Empresa Demo','Transportes Andinos S.A.S.','Logística del Norte Ltda.'].map((name,index)=>`<button class="btn company-option" data-company-choice="${index===0?'':escapeHtml(name)}"><strong>${escapeHtml(name)}</strong>${index?'<small>Empresa · NIT disponible</small>':''}</button>`).join('')}</div>`;body.querySelectorAll('[data-company-choice]').forEach(button=>button.addEventListener('click',()=>{if(companyPickerPurpose==='create'){pendingCreateCompany=button.dataset.companyChoice;closeDialog();openDialog('create');return}pendingCompanyFilter=button.dataset.companyChoice;closeDialog();openDialog('filters')}));return}
      if(kind==='filters'){eyebrow.textContent='Búsqueda avanzada';title.textContent='Filtros de '+config[view].title.toLowerCase();pendingCompanyFilter=companyFilter;const hasCompanyFilter=['thirdparties','users','invitations'].includes(view);body.innerHTML=`${hasCompanyFilter?`<div class="form-field full"><span>Empresa</span><button type="button" id="chooseCompany" class="btn company-select"><span>${escapeHtml(pendingCompanyFilter||'Todas las empresas')}</span><span aria-hidden="true">▾</span></button></div>`:''}<label class="form-field full">${view==='invoices'?'Número o NIT':'Nombre o identificador'}<input id="filterSearch" value="${escapeHtml(query)}" placeholder="Buscar ${config[view].singular}…"></label>${view==='invoices'?'<label class="form-field">Placa<input placeholder="Buscar placa" list="wireframe-plates"><datalist id="wireframe-plates"><option>KLM-482</option><option>TQR-916</option></datalist></label><label class="form-field">Conductor<input placeholder="Buscar conductor" list="wireframe-drivers"><datalist id="wireframe-drivers"><option>Carlos Ramírez</option><option>Laura Gómez</option></datalist></label>':''}${statusIndex[view]===undefined||view==='users'?'':`<label class="form-field full">Estado<select id="filterStatus"><option>Todos</option>${['Activa','Activo','Registrada','En revisión','Pendiente','Inactiva','Invitada','Finalizada'].map(value=>`<option ${statusFilter===value?'selected':''}>${value}</option>`).join('')}</select></label>`}`;if(view==='invitations')body.insertAdjacentHTML('beforeend',`<div class="form-grid full"><label class="form-field">Rol<select><option>Todos los roles</option><option>Administrador</option><option>Conductor</option></select></label><label class="form-field">Tipo de organización<select><option>Todas</option><option>Empresa</option><option>Tercero</option></select></label><label class="form-field">Entrega<select><option>Todos</option><option>Pendiente</option><option>Completada</option></select></label><div class="form-field full"><span>Tercero</span><button type="button" class="btn company-select" id="chooseThirdParty">Seleccionar tercero <span aria-hidden="true">▾</span></button><small>Selecciona una empresa antes para consultar los terceros asociados.</small></div></div>`);if(view==='users')body.insertAdjacentHTML('beforeend',`<div class="form-grid full"><label class="form-field full">Tipo de organización<select><option>Empresa</option><option selected>Tercero</option></select></label><div class="form-field full"><span>Tercero</span><button type="button" class="btn company-select">tercero uno <span aria-hidden="true">▾</span></button></div><label class="form-field">Rol<select><option>Todos los roles</option><option>Conductor</option></select></label><label class="form-field">Estado<select><option>Todos</option><option>Activo</option></select></label></div>`);body.querySelector('#chooseCompany')?.addEventListener('click',()=>{closeDialog();openDialog('companyPicker')});body.querySelector('#chooseThirdParty')?.addEventListener('click',()=>toast(pendingCompanyFilter?'Selecciona un tercero asociado a la empresa':'Selecciona una empresa primero'));save.textContent='Aplicar filtros';save.onclick=()=>{const nextQuery=document.querySelector('#filterSearch').value,nextStatus=document.querySelector('#filterStatus')?.value||'Todos',nextCompany=pendingCompanyFilter;const changed=nextQuery!==query||nextStatus!==statusFilter||nextCompany!==companyFilter;query=nextQuery;statusFilter=nextStatus;companyFilter=nextCompany;page=1;closeDialog();if(changed)loadView();else render()};return}
      eyebrow.textContent=kind==='detail'?'Vista de detalle':kind==='edit'?'Editar registro':'Nuevo registro';title.textContent=kind==='detail'?'Detalle de '+config[view].singular:kind==='edit'?'Editar '+config[view].singular:'Crear '+config[view].singular;
      const values=row||[],dateValue=values.find(value=>/^\d{1,2}\s+[a-záéíóú]{3}\s+\d{4}$/i.test(String(value))),editedAt=values[0]?.startsWith('Logística')?'21 nov 2026':null,auditDate=editedAt||dateValue||'18 nov 2026',auditMarkup=`<div class="form-field full"><span>${editedAt?'Fecha de edición':'Fecha de creación'}</span><p>${escapeHtml(auditDate)}</p></div>`,detailValues=values.filter(value=>value!==dateValue);
      body.innerHTML=kind==='detail'?`<p class="full"><strong>${escapeHtml(values[0]||'Nuevo registro')}</strong></p>${detailValues.map((v,i)=>`<div class="form-field"><span>${escapeHtml(config[view].cols[i]||'Información')}</span><p>${escapeHtml(v)}</p></div>`).join('')}${view==='invoices'?`<div class="form-field"><span>Valor de factura</span><p>$ 25.000,00</p></div><div class="form-field"><span>IVA</span><p>$ 0,00</p></div><div class="form-field"><span>Otros impuestos</span><p>$ 670,00</p></div><div class="form-field"><span>Valor total</span><p>$ 25.670,00</p></div><div class="form-field"><span>Imagen adjunta</span><button type="button" class="btn">Ver</button></div><div class="form-field"><span>CUFE</span><p>d34e3cc68a7c34bbf2e72ebf2445451114b8e8d1a36e619b5a2215e0528cb86d631cbec162876e0f6a50a9903e374ada</p></div><div class="form-field full"><span>URL de origen QR</span><a href="https://catalogo-vpfe.dian.gov.co/document/searchqr" target="_blank" rel="noopener noreferrer">Ir a la DIAN</a></div>`:''}${view==='companies'||view==='thirdparties'?`<div class="form-field"><span>Ciudad</span><p>Bogotá</p></div><div class="form-field full detail-status"><span>Estado</span>${statusBadge(values[view==='companies'?2:4]||'Activo')}</div>`:''}${auditMarkup}`:`${view==='invoices'?`<label class="form-field">Valor de factura<input inputmode="decimal" placeholder="1.234,56"></label><label class="form-field">IVA<input inputmode="decimal" placeholder="123,45"></label><label class="form-field">Otros impuestos<input inputmode="decimal" placeholder="0,00"></label><label class="form-field">Valor total<input inputmode="decimal" placeholder="1.357,01"></label><label class="form-field full">${kind==='create'?'Imagen de factura (obligatoria)':'Adjuntar imagen (opcional)'}<input type="file" accept="image/jpeg,image/png" ${kind==='create'?'required':''}></label>`:''}${kind==='create'&&view==='thirdparties'?`<div class="form-field full"><span>Empresa asociada</span><button type="button" id="chooseCreateCompany" class="btn company-select"><span>${escapeHtml(pendingCreateCompany||'Seleccionar empresa')}</span><span aria-hidden="true">▾</span></button></div>`:''}<label class="form-field">${config[view].cols[0]}<input placeholder="Ingresa ${config[view].cols[0].toLowerCase()}" value="${kind==='edit'?escapeHtml(values[0]||''):''}"></label><label class="form-field">${config[view].cols[1]}<input placeholder="Ingresa ${config[view].cols[1].toLowerCase()}" value="${kind==='edit'?escapeHtml(values[1]||''):''}"></label><label class="form-field">Estado<select><option>Activo</option><option>Pendiente</option><option>Inactivo</option></select></label><label class="form-field">Fecha de vigencia<input type="date"></label><label class="form-field full">Descripción<textarea rows="3" placeholder="Información adicional"></textarea></label>${kind==='edit'?auditMarkup:''}`;
      body.querySelector('#chooseCreateCompany')?.addEventListener('click',()=>{companyPickerPurpose='create';closeDialog();openDialog('companyPicker')});
      save.style.display=kind==='detail'?'none':'inline-block';save.textContent='Guardar';if(kind==='create'&&view==='thirdparties')save.disabled=!pendingCreateCompany;save.onclick=()=>{closeDialog();toast(config[view].singular+' guardado correctamente')};
    }
    function closeDialog(){modal.classList.remove('open');document.body.style.overflow=''}
    document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    document.querySelector('#menuToggle').addEventListener('click',e=>{const drawer=innerWidth<=850||document.body.classList.contains('mobile-preview');let opened;if(drawer){opened=sidebar.classList.toggle('open')}else{const collapsed=sidebar.classList.toggle('collapsed');document.querySelector('.layout').classList.toggle('sidebar-collapsed',collapsed);opened=!collapsed}e.currentTarget.setAttribute('aria-expanded',String(opened));e.currentTarget.setAttribute('aria-label',opened?'Cerrar navegación':'Abrir navegación')});
    document.querySelector('#previewToggle').addEventListener('click',e=>{const enabled=document.body.classList.toggle('mobile-preview');e.currentTarget.setAttribute('aria-pressed',String(enabled));e.currentTarget.setAttribute('aria-label',enabled?'Mostrar escritorio':'Activar vista móvil');e.currentTarget.textContent=enabled?'▭ Escritorio':'▯ Móvil';sidebar.classList.remove('open','collapsed');document.querySelector('.layout').classList.remove('sidebar-collapsed');document.querySelector('#menuToggle').setAttribute('aria-expanded',String(!enabled&&innerWidth>850))});
    modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))closeDialog()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
    loadView();
  </script>
