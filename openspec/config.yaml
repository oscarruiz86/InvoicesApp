schema: spec-driven

context: |
  El repositorio tiene dos ramas principales: `main` para producción y
  `development` para integración de desarrollo. Ambas están protegidas:
  no se aceptan commits ni pushes directos; los cambios llegan mediante un
  pull request aprobado.

  Cada propuesta OpenSpec activa se implementa en una rama exclusiva con el
  nombre `openspec/<id-de-la-propuesta>`, creada desde `development`. Su pull
  request se dirige a `development`. Las entregas a producción se promueven
  desde `development` hacia `main` mediante un pull request aprobado.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
