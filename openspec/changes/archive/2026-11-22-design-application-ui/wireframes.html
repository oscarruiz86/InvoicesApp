<script>
(() => {
  const originalRender = render;
  let mobileDrawerOpen = false;
  const hiddenThirdPartyScreens = new Set([
    'terceros', 'tercero', 'tercero-alta', 'tercero-edicion', 'tercero-estado'
  ]);
  const roleLabels = {
    A: 'Administrador de la aplicación',
    C: 'Administrador de empresa',
    T: 'Administrador de asociados',
    D: 'Conductor'
  };
  const roleModules = {
    A: ['empresas', 'usuarios', 'roles', 'asociaciones', 'parametros'],
    C: ['empresas', 'asociaciones'],
    T: ['asociaciones', 'conductores', 'vehiculos', 'asignaciones', 'facturas'],
    D: ['vehiculos', 'asignaciones', 'facturas']
  };
  const originalAssociations = byId.asociaciones;
  const originalAssociation = byId.asociacion;
  originalAssociations.title = 'Asociados';
  originalAssociations.fields = ['Persona', 'Organización', 'Rol asociado', 'Vigencia', 'Acciones'];
  originalAssociations.sample = ['Laura Ríos', 'Transportes Andinos', 'COMPANY_ADMIN', 'Vigente', ''];
  originalAssociations.links = [{ label: 'Volver a inicio', to: 'inicio' }];
  originalAssociations.note = 'Unifica la administración de asociados y terceros autorizados.';
  originalAssociation.title = 'Detalle de asociado';

  for (let index = screens.length - 1; index >= 0; index -= 1) {
    if (hiddenThirdPartyScreens.has(screens[index].id)) screens.splice(index, 1);
  }
  for (const id of hiddenThirdPartyScreens) delete byId[id];
  for (let index = menu.length - 1; index >= 0; index -= 1) {
    if (hiddenThirdPartyScreens.has(menu[index])) menu.splice(index, 1);
  }

  function action(label, action, primary = false) {
    return '<button type="button" data-action="' + action + '"' + (primary ? ' class="primary"' : '') + '>' + label + '</button>';
  }

  function dialog(title, content, actions) {
    return '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-card"><h3 id="dialog-title">' + title + '</h3>' + content + '<div class="actions">' + actions + '</div></div></div>';
  }

  function decorateShell() {
    const bar = q('frame').querySelector('.bar');
    const strong = bar.querySelector('strong');
    const menuButton = bar.querySelector('[data-menu]');
    if (menuButton && strong) {
      menuButton.innerHTML = '<span class="hamburger" aria-hidden="true">☰</span>';
      menuButton.setAttribute('aria-label', 'Abrir menú de navegación');
      menuButton.setAttribute('data-tooltip', 'Menú de navegación');
      bar.insertBefore(menuButton, strong);
    }
    const contextButton = bar.querySelector('[data-to="contexto"]');
    const sessionButton = bar.querySelector('[data-to="logout"]');
    if (!contextButton || !sessionButton || bar.querySelector('.header-actions')) return;
    const actions = document.createElement('div');
    actions.className = 'header-actions';
    actions.innerHTML = '<div class="user-menu"><button type="button" class="avatar" data-user-menu aria-expanded="false" aria-haspopup="menu" aria-label="Abrir menú de Laura Ríos">LR</button><div class="user-popover" role="menu" hidden><p><strong>Laura Ríos</strong></p><button type="button" data-to="contexto" role="menuitem">' + organization + ' · ' + roleLabels[q('role').value] + '</button><button type="button" data-action="profile" role="menuitem">Mi perfil</button><button type="button" data-action="password" role="menuitem">Cambiar contraseña</button><button type="button" data-to="logout" role="menuitem">Cerrar sesión</button></div></div>';
    contextButton.remove();
    sessionButton.remove();
    bar.appendChild(actions);
  }

  function renderRoleHome(screen) {
    if (screen.id !== 'inicio') return;
    const section = q('frame').querySelector('.screen');
    const role = q('role').value;
    const ids = roleModules[role];
    const cards = ids
      .map(id => byId[id])
      .filter(Boolean)
      .map(module => '<article class="panel card"><h3>' + esc(module.title) + '</h3>' + button(module.id, 'Abrir ' + module.title.toLowerCase()) + '</article>')
      .join('');
    const content = '<div class="role-intro"><h3>' + roleLabels[role] + '</h3><p class="muted">Accesos disponibles para este rol y el contexto actual.</p></div><section class="role-group" aria-label="Módulos disponibles"><div class="grid">' + cards + '</div></section>';
    const actionArea = section.querySelector('.actions');
    actionArea.previousElementSibling.remove();
    actionArea.innerHTML = '';
    actionArea.insertAdjacentHTML('beforebegin', content);
  }

  function renderAssociated() {
    if (current !== 'asociaciones') return;
    const section = q('frame').querySelector('.screen');
    const content = '<div class="toolbar"><label>Buscar<input placeholder="Buscar en asociados"></label><label>Filtro<select><option>Todos</option><option>Vigentes</option><option>Suspendidos</option></select></label></div><div class="panel"><div class="associated-row"><div><strong>Laura Ríos</strong><p class="muted">laura@example.test · COMPANY_ADMIN · Transportes Andinos</p></div><div class="row-actions">' + action('Ver', 'view-associated') + action('Suspender', 'suspend-associated') + '</div></div></div>';
    const actionArea = section.querySelector('.actions');
    section.querySelector('.toolbar')?.remove();
    section.querySelector('.table-scroll')?.remove();
    section.querySelector('.mobile-data')?.remove();
    section.querySelector('.footer')?.remove();
    actionArea.innerHTML = action('Crear asociado', 'create-associated', true) + action('Volver a inicio', 'go-home');
    actionArea.insertAdjacentHTML('beforebegin', content);
  }

  function renderStatus(state) {
    if (!state) return;
    const labels = {
      loading: 'Actualizando información…',
      empty: 'No hay resultados con los filtros actuales.',
      failure: 'No pudimos completar la solicitud.',
      saved: 'Los cambios se guardaron.'
    };
    const style = state === 'failure' ? ' error' : state === 'saved' ? ' success' : '';
    const retry = state === 'failure' ? action('Reintentar', 'retry') : state === 'empty' ? action('Limpiar filtros', 'retry') : '';
    q('frame').querySelector('.screen').insertAdjacentHTML('afterbegin', '<div class="request-status' + style + '" role="status"><span>' + labels[state] + '</span>' + retry + '</div>');
  }

  render = function enhancedRender(focus = false) {
    const stateControl = q('state');
    const desiredState = stateControl.value;
    if (desiredState) stateControl.value = '';
    originalRender(focus);
    stateControl.value = desiredState;
    decorateShell();
    renderRoleHome(byId[current]);
    renderAssociated();
    renderStatus(desiredState);
    const drawer = q('frame').querySelector('.drawer');
    if (drawer && q('frame').classList.contains('mobile')) drawer.open = mobileDrawerOpen;
  };

  q('frame').addEventListener('click', event => {
    if (event.target.closest('[data-menu]') && q('frame').classList.contains('mobile')) {

      drawer.open = mobileDrawerOpen;
      return;

      q('state').value = '';
      render(true);
      return;
    }

      current = 'usuario';
      render(true);
      return;
    }
    if (actionName === 'password') {
      q('frame').insertAdjacentHTML('beforeend', dialog('Cambiar contraseña', '<p>La contraseña se actualiza mediante el proveedor de identidad.</p>', action('Entendido', 'close-dialog', true)));
      return;
    }
    if (actionName === 'view-associated') {
      current = 'asociacion';
      render(true);
      return;
    }
    if (actionName === 'create-associated') {
      q('frame').insertAdjacentHTML('beforeend', dialog('Crear asociado', '<label>Correo del usuario a asociar<input type="email" autocomplete="email" placeholder="nombre@empresa.com"></label>', action('Cancelar', 'close-dialog') + action('Continuar', 'close-dialog', true)));
      return;
    }
    if (actionName === 'go-home') {
      current = 'inicio';
      render(true);
      return;
    }
    if (actionName === 'suspend-associated') {
      q('frame').insertAdjacentHTML('beforeend', dialog('Suspender asociado', '<p>Laura Ríos perderá el acceso asociado a Transportes Andinos.</p>', action('Cancelar', 'close-dialog') + action('Suspender', 'confirm-suspend', true)));
      return;
    }
    if (actionName === 'confirm-suspend') {
      q('frame').querySelector('.dialog')?.remove();
      q('state').value = 'saved';
      render(true);
      return;
    }
    if (actionName === 'close-dialog') {
      q('frame').querySelector('.dialog')?.remove();
    }
  });

  render();
})();
</script></html>
