name: Production images
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix backend run check
      - run: npm --prefix backend run openapi:check
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run production:check
      - run: npm --prefix frontend run production:http-check
      - run: docker build --target production -f backend/Dockerfile -t invoices-backend:ci .
      - run: docker build --target worker -f backend/Dockerfile -t invoices-workers:ci .
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3.4.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate offline credential public JWKS
        env:
          OFFLINE_JWKS: ${{ vars.OFFLINE_CREDENTIAL_PUBLIC_JWKS }}
        run: |
          node --input-type=module -e 'const raw=process.env.OFFLINE_JWKS; if(!raw) throw new Error("Set repository variable OFFLINE_CREDENTIAL_PUBLIC_JWKS"); const parsed=JSON.parse(raw); const keys=Array.isArray(parsed)?parsed:parsed?.keys; if(!Array.isArray(keys)||!keys.length||keys.length>10) throw new Error("JWKS must contain 1 to 10 public keys"); const ids=new Set(); for(const k of keys){if(k?.kty!=="EC"||k?.crv!=="P-256"||typeof k.x!=="string"||typeof k.y!=="string"||typeof k.kid!=="string"||!/^([A-Za-z0-9._-]){1,64}$/.test(k.kid)||"d" in k||ids.has(k.kid)) throw new Error("Invalid public ES256 JWK"); ids.add(k.kid)}'
      - uses: docker/build-push-action@16ebe778df0e7752d2cfcbd924afdbbd89c1a755 # v6.18.0
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_KEYCLOAK_URL=https://auth.oarg.casa
            VITE_KEYCLOAK_REALM=invoices
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.KEYCLOAK_WEB_CLIENT_ID }}
            VITE_OFFLINE_CREDENTIAL_PUBLIC_JWKS=${{ vars.OFFLINE_CREDENTIAL_PUBLIC_JWKS }}
            VITE_OFFLINE_CREDENTIAL_MAX_TTL_HOURS=72
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/invoices-frontend:${{ github.sha }}
      - uses: docker/build-push-action@16ebe778df0e7752d2cfcbd924afdbbd89c1a755 # v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/invoices-backend:${{ github.sha }}
      - uses: docker/build-push-action@16ebe778df0e7752d2cfcbd924afdbbd89c1a755 # v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          target: worker
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/invoices-workers:${{ github.sha }}
