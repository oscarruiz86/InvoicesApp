name: invoices-offline-sync-tests
services:
  mongodb-test:
    image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    command: ["mongod", "--replSet", "invoice-tests-rs", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_TEST_PORT:-27019}:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status() } catch (e) { if (e.code === 94) rs.initiate({_id:'invoice-tests-rs',members:[{_id:0,host:'127.0.0.1:27017'}]}); else throw e; } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s
